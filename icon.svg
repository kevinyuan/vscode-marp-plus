<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Marp Plus.

    An original mark drawn in the Marp community's blue palette: two ascending
    slide cards over two text rules, with a plus badge for the "Plus" feature set.
    Marp Plus is an independent third-party extension and is not affiliated with,
    or endorsed by, the Marp team.
  -->
  <title>Marp Plus</title>

  <!-- Two ascending slide cards -->
  <path d="M92 688 V430 L438 232 v456 z" fill="#67b9e4"/>
  <path d="M466 688 V314 L812 116 v572 z" fill="#0188d2"/>

  <!-- Text rules beneath the deck -->
  <rect x="92" y="744" width="446" height="46" rx="23" fill="#9fd4ee"/>
  <rect x="92" y="826" width="286" height="46" rx="23" fill="#67b9e4"/>

  <!-- Plus badge -->
  <circle cx="792" cy="800" r="176" fill="#ffffff"/>
  <circle cx="792" cy="800" r="150" fill="#0188d2"/>
  <path d="M792 714 v172 M706 800 h172" stroke="#ffffff" stroke-width="54" stroke-linecap="round"/>
</svg>
